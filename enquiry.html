<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | PanelPro Auto Spares</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <img src="_images/logo.png" alt="PanelPro Auto Spares Logo" width="200" height="200">
            <a href="index.html">PanelPro Auto Spares</a>
        </div>

        <nav class="main-navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contactus.html">Contact</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-intro">
            <h1>Send an Enquiry</h1>
            <p>Tell us what parts or services you need and our team will get back to you with the right solution.</p>
        </section>

        <section class="contact-content">
            <h2>Request a Quote or More Information</h2>

            <form class="contact-form">
                <label>
                    Full Name
                    <input type="text" name="name" placeholder="Your full name">
                </label>

                <label>
                    Email Address
                    <input type="email" name="email" placeholder="Your email address">
                </label>

                <label>
                    Phone Number
                    <input type="tel" name="phone" placeholder="Your phone number">
                </label>

                <label>
                    Vehicle Make / Model
                    <input type="text" name="vehicle" placeholder="e.g. Toyota Hilux">
                </label>

                <label>
                    Enquiry Type
                    <select name="enquiry-type">
                        <option value="">Select an option</option>
                        <option value="parts">Parts Enquiry</option>
                        <option value="quote">Quote Request</option>
                        <option value="trade">Trade / Bulk Order</option>
                        <option value="service">Workshop Service</option>
                    </select>
                </label>

                <label>
                    Message
                    <textarea name="message" rows="6" placeholder="Tell us what parts or service you need"></textarea>
                </label>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 PanelPro Auto Spares. All rights reserved.</p>
    </footer>
</body>
</html>
